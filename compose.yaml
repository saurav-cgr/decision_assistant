name: decision-assistant

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-decision_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-decision_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decision_assistant}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_GENERATION_MODEL: ${OLLAMA_GENERATION_MODEL:-qwen3:8b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://decision_assistant:decision_assistant@db:5432/decision_assistant}
      UPLOAD_DIRECTORY: ${UPLOAD_DIRECTORY:-/workspace/uploads}
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-gemini}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_GENERATION_MODEL: ${GEMINI_GENERATION_MODEL:-gemini-3.1-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      GEMINI_EMBEDDING_DIMENSION: ${GEMINI_EMBEDDING_DIMENSION:-768}
      GEMINI_EMBEDDING_CONFIG_VERSION: ${GEMINI_EMBEDDING_CONFIG_VERSION:-retrieval-prefix-v1}
      GEMINI_GENERATION_PROMPT_VERSION: ${GEMINI_GENERATION_PROMPT_VERSION:-gemini-json-v3}
      GEMINI_EMBEDDING_BATCH_SIZE: ${GEMINI_EMBEDDING_BATCH_SIZE:-32}
      GEMINI_MAX_PROMPT_CHARACTERS: ${GEMINI_MAX_PROMPT_CHARACTERS:-100000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_GENERATION_MODEL: ${OLLAMA_GENERATION_MODEL:-qwen3:8b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma}
      OLLAMA_EMBEDDING_DIMENSION: ${OLLAMA_EMBEDDING_DIMENSION:-768}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_ACCESS_TOKEN_TTL_MINUTES: ${AUTH_ACCESS_TOKEN_TTL_MINUTES:-1440}
      AUTH_BOOTSTRAP_USERNAME: ${AUTH_BOOTSTRAP_USERNAME:-}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-120}
      MODEL_RETRY_COUNT: ${MODEL_RETRY_COUNT:-2}
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      RERANK_CANDIDATE_LIMIT: ${RERANK_CANDIDATE_LIMIT:-12}
      RERANK_MIN_CANDIDATES: ${RERANK_MIN_CANDIDATES:-6}
      RERANK_FINAL_LIMIT: ${RERANK_FINAL_LIMIT:-5}
      CHUNKING_PROFILE_PRESET: ${CHUNKING_PROFILE_PRESET:-baseline}
      RETRIEVAL_UNIT_STRATEGY: ${RETRIEVAL_UNIT_STRATEGY:-passage_hybrid}
      TIKTOKEN_CACHE_DIR: ${TIKTOKEN_CACHE_DIR:-/opt/tiktoken-cache}
      EVALUATION_DATASET_PATH: ${EVALUATION_DATASET_PATH:-/workspace/evaluation/questions.json}
      PYTHONPATH: /workspace/api/src
    command:
      - uvicorn
      - decision_assistant.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    working_dir: /workspace/api
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/workspace
      - uploads_data:/workspace/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build:
      context: ./web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    working_dir: /app
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5173').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
  ollama_data:
  uploads_data:
  web_node_modules:
